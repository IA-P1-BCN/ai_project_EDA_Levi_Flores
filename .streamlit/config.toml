# Streamlit configuration for the executive dashboard (app/dashboard.py, task X2).
# A fixed light theme keeps the custom KPI cards and Plotly charts legible for every viewer.

[theme]
base = "light"
primaryColor = "#1B4F72"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#E9EEF4"
textColor = "#1F2933"
font = "sans serif"

[client]
# Hide developer-only toolbar entries (e.g. "Deploy") from executive viewers.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
