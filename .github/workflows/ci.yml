name: CI - Quality Gate

# Every check below is also runnable locally with:
#   .\EDA\Scripts\python.exe .github/scripts/run_local_ci.py
# The check logic lives in .github/scripts/ so CI and the local gate never drift apart.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (Ruff + Flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters (versions from requirements.txt)
        run: grep -E '^(ruff|flake8)\b' requirements.txt | xargs python -m pip install

      - name: Ruff (blocking, includes notebooks)
        run: python -m ruff check . --output-format=github

      - name: Flake8 syntax errors and undefined names (blocking)
        run: >-
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          --exclude=.idea,EDA,venv,.venv

  notebooks:
    name: Notebooks (structure, execution, reproducibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate, execute top to bottom and check data/processed/ is reproducible
        run: python .github/scripts/check_notebooks.py --execute --output-dir "$RUNNER_TEMP/executed-notebooks"

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: ${{ runner.temp }}/executed-notebooks/
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect test suite
        id: detect
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tests/test_*.py yet (task X3); skipping pytest."
          fi

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        if: steps.detect.outputs.present == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        if: steps.detect.outputs.present == 'true'
        run: python -m pytest

  data-contract:
    name: Data contract (specs/ontology.md)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate processed datasets against the ontology
        run: python .github/scripts/check_data_contract.py

  repo-hygiene:
    name: Repository hygiene and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Protected files, forbidden files and file size
        run: python .github/scripts/check_repo_hygiene.py

      - name: Artifact naming, chart DPI and handoff contract
        run: python .github/scripts/check_conventions.py
