name: CI - Integración Continua

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: 🔍 Linting y Validación de Código
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: 📦 Instalar herramientas de calidad y dependencias base
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff nbqa nbformat pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧹 Linting con Ruff
        run: |
          ruff check . --exit-zero

      - name: 🔎 Verificación de sintaxis Python con Flake8
        run: |
          # Detener la compilación si hay errores de sintaxis o nombres indefinidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.idea,EDA,venv,.venv
          # Aviso de estilo y complejidad sin bloquear el build
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.idea,EDA,venv,.venv

      - name: 📓 Validar formato e integridad de Jupyter Notebooks
        run: |
          python -c "
          import os, sys, json, nbformat
          has_error = False
          for root, dirs, files in os.walk('.'):
              if any(ignored in root for ignored in ['.idea', 'EDA', 'venv', '.venv', '.git']):
                  continue
              for f in files:
                  if f.endswith('.ipynb') and not f.startswith('.'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8') as nbf:
                              nb = nbformat.read(nbf, as_version=4)
                              nbformat.validate(nb)
                          print(f'✅ Notebook válido: {path}')
                      except Exception as e:
                          print(f'❌ Error en notebook {path}: {e}', file=sys.stderr)
                          has_error = True
          if has_error:
              sys.exit(1)
          "

      - name: 🧪 Ejecución de Tests (si existen)
        run: |
          if [ -d "tests" ] || [ -f "test_*.py" ] || [ -f "*_test.py" ]; then
            pytest -v
          else
            echo "No se encontraron tests automatizados todavía. Verificación completada con éxito."
          fi

  repo-hygiene:
    name: 🛡️ Seguridad y Buenas Prácticas
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🚫 Comprobar que no existan archivos sensibles (.env)
        run: |
          if git ls-files | grep -E "(^|/)\.env($|\..*)"; then
            echo "::error::Se detectó un archivo .env en el repositorio. Los archivos .env no deben subirse a Git."
            exit 1
          else
            echo "✅ No hay archivos .env rastreados."
          fi

      - name: ⚖️ Control de tamaño de archivos en el repositorio
        run: |
          python -c "
          import os, subprocess
          files = subprocess.check_output(['git', 'ls-files']).decode('utf-8').splitlines()
          oversized = []
          for f in files:
              if os.path.exists(f) and os.path.isfile(f):
                  size_mb = os.path.getsize(f) / (1024 * 1024)
                  if size_mb > 15:
                      oversized.append((f, size_mb))
          if oversized:
              for f, sz in oversized:
                  print(f'::warning file={f}::El archivo {f} pesa {sz:.2f} MB. Para datasets grandes considera almacenamiento externo o Git LFS.')
          else:
              print('✅ No hay archivos excesivamente pesados rastreados.')
          "
